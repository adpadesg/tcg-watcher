name: Informe diario

on:
  schedule:
    # 20:00 en España son las 18:00 UTC en verano y las 19:00 en invierno.
    # Se dispara a las dos horas y el propio script descarta la que no toca.
    - cron: "0 18,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tcg-watcher
  cancel-in-progress: false

jobs:
  informar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Enviar el resumen del día
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py --informe
