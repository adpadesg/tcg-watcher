name: Vigilancia

on:
  schedule:
    # Cada 30 minutos. GitHub no garantiza puntualidad: en horas punta
    # las ejecuciones programadas pueden retrasarse.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tcg-watcher
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Comprobar el token de Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          # Si el secret está mal, el fallo aparece aquí con un mensaje claro
          # en vez de reventar más adelante sin explicación.
          codigo=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getMe")
          if [ "$codigo" != "200" ]; then
            echo "❌ Telegram devolvió HTTP $codigo al validar el token."
            echo "   Revisa el secret TELEGRAM_BOT_TOKEN en Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "✅ Token válido."

      - name: Buscar cambios y avisar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Guardar el estado
        if: always()
        run: bash .github/guardar_estado.sh "Actualiza estado (vigilancia)"
